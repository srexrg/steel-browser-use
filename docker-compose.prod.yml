version: '3.8'

services:
  # Steel Browser service
  steel-browser:
    image: ghcr.io/steel-dev/steel-browser:latest
    container_name: steel-browser
    restart: unless-stopped
    ports:
      - "3000:3000"
      - "9223:9223"
    environment:
      - DOMAIN=${DOMAIN}
      - CDP_DOMAIN=${DOMAIN}
      - API_URL=https://${DOMAIN}
    volumes:
      - steel-cache:/app/.cache
    networks:
      - app-network
    deploy:
      resources:
        limits:
          memory: 2G
        reservations:
          memory: 1G

  # Python FastAPI server
  python-server:
    build:
      context: ./python-server
      dockerfile: Dockerfile
    container_name: python-server
    restart: unless-stopped
    ports:
      - "8000:8000"
    env_file:
      - ./python-server/.env
    environment:
      - STEEL_BASE_URL=http://steel-browser:3000
      - STEEL_UI_URL=https://${DOMAIN}/steel-ui
      - ALLOWED_ORIGINS=https://${DOMAIN}
    depends_on:
      - steel-browser
    networks:
      - app-network
    deploy:
      resources:
        limits:
          memory: 1G
        reservations:
          memory: 512M

  # Next.js frontend
  nextjs:
    build:
      context: .
      dockerfile: Dockerfile.nextjs
    container_name: nextjs
    restart: unless-stopped
    ports:
      - "3001:3001"
    environment:
      - NODE_ENV=production
      - NEXT_PUBLIC_API_URL=https://${DOMAIN}/api
    depends_on:
      - python-server
    networks:
      - app-network
    deploy:
      resources:
        limits:
          memory: 1G
        reservations:
          memory: 512M

  # Nginx reverse proxy
  nginx:
    image: nginx:alpine
    container_name: nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/conf.d:/etc/nginx/conf.d:ro
      - ./certbot/conf:/etc/letsencrypt:ro
      - ./certbot/www:/var/www/certbot:ro
    depends_on:
      - nextjs
      - python-server
      - steel-browser
    networks:
      - app-network
    command: "/bin/sh -c 'while :; do sleep 6h & wait $${!}; nginx -s reload; done & nginx -g \"daemon off;\"'"

  # Certbot for SSL certificates
  certbot:
    image: certbot/certbot
    container_name: certbot
    restart: unless-stopped
    volumes:
      - ./certbot/conf:/etc/letsencrypt
      - ./certbot/www:/var/www/certbot
    entrypoint: "/bin/sh -c 'trap exit TERM; while :; do certbot renew; sleep 12h & wait $${!}; done;'"

networks:
  app-network:
    driver: bridge

volumes:
  steel-cache:

