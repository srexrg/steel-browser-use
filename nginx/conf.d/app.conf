  #      proxy_read_timeout 300s;
 #       proxy_connect_timeout 75s;
#    }


    location /ui/ {
        proxy_pass http://steel-browser:3000/ui/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Port 443;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_cache_bypass $http_upgrade;
        sub_filter 'http://steel.srexrg.me' 'https://steel.srexrg.me';
        sub_filter 'ws://steel.srexrg.me' 'wss://steel.srexrg.me';
        sub_filter_once off;
        sub_filter_types application/json text/html text/javascript application/javascript;
    }


